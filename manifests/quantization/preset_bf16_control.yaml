# ============================================================================
# PRESET: bf16 control (unquantized anchor)
# ============================================================================
# HYPOTHESIS (H2, the anchor): this run IS "ground truth" -- every other
# preset's steering/QLoRA quality is interpreted as a DELTA from this run's
# quality, not in absolute terms, because absolute quality also depends on
# recipe difficulty and is not itself informative about quantization's
# effect. Nothing here is "confirmed/refuted" on its own; it is the
# reference point H1 (preset_8bit_midpoint.yaml) and H3
# (preset_low_bit_layer_scan.yaml) are measured against.
#
# Both arms matched: quantization: none, dtype: bfloat16 -- unquantized
# weights, bf16 compute throughout (see model_utils.py's bnb_config_for:
# "none" or any non-4/8bit string means "no BitsAndBytesConfig", load at
# `dtype` directly). QLoRA runs plain LoRA on a full-precision base here
# (finetune.py's train_qlora now skips prepare_model_for_kbit_training on
# this path, since that call is only valid/needed for an actually-quantized
# base) -- "QLoRA" as a literal name only applies to the two quantized
# presets; this is LoRA-bf16.
#
# WHY bf16 and not fp32 as "the" unquantized control: bf16 is the compute
# dtype used throughout this whole pipeline already (bnb_4bit_compute_dtype,
# torch_dtype for every load) -- an fp32 run would double memory again for a
# COMPUTE-dtype question (numerical range/precision of the arithmetic) that
# is orthogonal to the WEIGHT-quantization question this matrix is actually
# about. fp16 vs bf16 is the same kind of orthogonal question (numerical
# range, not weight fidelity) and is likewise deliberately excluded --
# see docs/quantization_matrix.md.
#
# Memory sizing -- RE-DERIVED from a real A100 measurement, same as
# preset_4bit_baseline.yaml (see that file's header for the corrected-slope
# derivation, ~0.1575 GiB/unit-batch vs the ~0.4125 extrapolated one this
# preset's ceiling used to assume). bf16 weights are ~2 bytes/param, ~8.0
# GiB for a ~4B model (4x the 4bit baseline's ~2.0 GiB):
#   ceiling = (39.4 - 6.5 - 8.0) / 0.1575 ~= 158
# batch_size: 72/42 (decoding/extraction) is a conservative ~1.5x/1.3x step
# up from the prior 48/32. Note what the gap to the 4bit preset's 96/62
# does NOT mean: it's purely because the weights are 6 GiB larger, not
# because bf16 is slower -- see the speed note below.
#
# ON SPEED, THIS PRESET IS THE OPPOSITE OF WHAT ITS BATCH SIZE SUGGESTS.
# bf16 is the FASTEST per token of the three -- no dequantization, native
# tensor-core matmuls -- because on a 40 GB card an 8 GiB model was never
# memory-constrained, so the other two presets pay unpacking costs for a
# saving that buys nothing here. Despite that, this preset will likely post
# one of the LONGEST wall times in the matrix, because its layer grid below
# is 3x wider than the others'. Per-token throughput and total wall time
# rank differently, and conflating them would misread the result.
#
# WHY THIS PRESET ALSO CARRIES A WIDER LAYER SWEEP: bf16 has the most VRAM
# headroom of the three precision levels even at a smaller batch size (no
# quantization overhead competing for the same budget), making it the
# cheapest preset to safely widen -- and widening it here (not in the other
# two) establishes which layer is robust when there is NO quantization noise
# to confound the answer, which is exactly the baseline
# preset_low_bit_layer_scan.yaml's own hypothesis (H3) needs to compare
# against. layers: ["early","mid","late"] triples the extraction/application
# grid vs the other two presets' single "mid" layer; coefficients/methods/
# n_sweep are otherwise held at the baseline's values for comparability.
# ============================================================================
experiment:
  name: quantization-bf16-control
  seed: 17
  # Trimmed to [10, 40] and coefficients/max_records widened -- see
  # preset_4bit_baseline.yaml's recipe comments for the full rationale.
  n_sweep: [10, 40]
artifacts:
  root: /content/steering_factory_artifacts
  publish_root: null
models:
  - id: qwen3_4b_bf16
    name_or_path: Qwen/Qwen3-4B
    dtype: bfloat16
    quantization: none
  - id: gemma3_4b_bf16
    name_or_path: google/gemma-3-4b-it
    dtype: bfloat16
    quantization: none
splits:
  seed: 17
  steer_fraction: 0.4
  validation_fraction: 0.2
  group_key: category
capability_probe:
  enabled: true
  max_new_tokens: 24
decoding:
  max_new_tokens: 96
  # Raised 48 -> 72 (see header). Lower than the 4bit preset's 96 only
  # because bf16 weights are ~8 GB vs ~2.2 GB, not because bf16 is slower --
  # it is the FASTEST per token here (no dequantization, native tensor
  # cores). This preset's long wall time comes from its 3x wider layer
  # grid, not its precision.
  batch_size: 72
extraction:
  # Raised 32 -> 42. Below decoding on purpose -- extraction has NO OOM
  # backoff. See preset_4bit_baseline.yaml's comment for the full reasoning.
  batch_size: 42
recipes:
  - id: harmful_instruction_compliance
    behavior: harmful_instruction_compliance
    dataset:
      adapter: harmbench
      dataset: walledai/HarmBench
      subset: standard
      reviewed_dataset_card: true
      max_records: 250
    extraction: [mean_diff, whitened_mean_diff]
    application:
      # Widened vs the other two presets (see header comment): establishes
      # which layer is robust with no quantization noise to confound it.
      layers: ["early", "mid", "late"]
      coefficients: [-2, -1.5, -1, -0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75, 1, 1.5, 2]
      token_scopes: [all]
  - id: calibrated_abstention_real
    behavior: appropriate_abstention
    dataset:
      adapter: abstentionbench
      dataset: facebook/AbstentionBench
      reviewed_dataset_card: true
      on_load_error: skip
      max_records: 250
    extraction: [mean_diff, whitened_mean_diff]
    application:
      layers: ["mid"]
      coefficients: [-2, -1.5, -1, -0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75, 1, 1.5, 2]
      token_scopes: [all]
  # REMOVED: structured_output_real (JSONSchemaBench).
  #
  # Cut after it OOMed four separate runs and produced no usable signal.
  # Both reasons are worth keeping written down, because they are selection
  # criteria for any future recipe, not just facts about this one:
  #
  #  1. MEMORY. Its prompts embed a whole JSON schema, so lengths ranged from
  #     a few dozen tokens to the truncation cap. Raising that cap to 2048 so
  #     schemas stopped being cut mid-object made extraction's own forward
  #     pass allocate 64 texts x 2048 x 9728 (the MLP intermediate) = 2.38 GiB
  #     in one tensor -- the exact allocation every OOM reported. No other
  #     recipe here has prompts remotely that long or that variable.
  #  2. NO SIGNAL. Even before the memory problem, JSON parsing succeeded on
  #     2 of 2160 steering rows and 1 of 360 QLoRA rows. Its quality key
  #     (leaf_exact_match) is None whenever parsing fails, and a recipe whose
  #     quality is None everywhere is silently DROPPED from the comparison
  #     rather than reported as a zero -- so it consumed roughly half the
  #     run's generation budget and contributed nothing to the report.
  #
  # Nothing is lost: the jsonschemabench adapter, the structured_output
  # behavior, and structured_score all remain in the codebase. Re-add this
  # block to run it, ideally as its OWN manifest so its memory profile can
  # only take down its own run -- and give extraction its own smaller
  # batch size there, since extraction.py's forward pass has no OOM backoff.
  - id: sycophancy_agreement
    # See preset_4bit_baseline.yaml for the full rationale. Kept at ONE
    # layer even though this preset widens harmful's layer grid to three:
    # the layer sweep exists to answer H3 (is the best layer
    # quantization-dependent?), which is asked of the safety recipe, not
    # of every recipe -- and tripling this one too would triple the
    # cheapest recipe in the run for no additional hypothesis.
    behavior: multiple_choice_eval
    dataset:
      adapter: model_written_evals
      dataset: Anthropic/model-written-evals
      subset: sycophancy/sycophancy_on_political_typology_quiz.jsonl
      reviewed_dataset_card: true  # cc-by-4.0
      max_records: 250
    extraction: [mean_diff, whitened_mean_diff]
    application:
      layers: ["mid"]
      coefficients: [-2, -1.5, -1, -0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75, 1, 1.5, 2]
      token_scopes: [all]
    decoding:
      max_new_tokens: 8
  - id: benign_over_refusal_control
    behavior: harmful_instruction_compliance
    dataset:
      adapter: xstest
      dataset: walledai/XSTest
      reviewed_dataset_card: true
      # Trimmed 100 -> 60 -- see preset_4bit_baseline.yaml's comment.
      max_records: 60
      apply_vectors_from: harmful_instruction_compliance
      apply_adapter_from: harmful_instruction_compliance
finetune:
  backend: qlora
  matched_split: steer
  # Cut from 200 to 25 -- see preset_4bit_baseline.yaml's identical comment
  # (real train-loss log plateaued by step 15-20).
  max_steps: 25
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  batch_size: 4
  gradient_accumulation_steps: 2
