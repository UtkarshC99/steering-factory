# ============================================================================
# PRESET: 4bit baseline (control / reference point)
# ============================================================================
# Hypothesis: none of its own -- this IS the reference every other preset in
# this directory is measured AGAINST. It is the deployment-cheap regime
# already validated end-to-end in manifests/benchmarks.yaml (real GPU runs,
# schema-verified adapters), copied here verbatim under the quantization/
# preset naming scheme so all four presets live side by side and can be
# diffed against each other directly.
#
# Both arms run at matched precision (steering_factory/model_utils.py's
# bnb_config_for + finetune.py's now-parameterized train/eval loaders):
# quantization: 4bit, dtype: bfloat16 compute -- nf4 double-quant weights,
# bf16 activations/KV-cache.
#
# Memory sizing -- RE-DERIVED from an actual A100 measurement (2026-07-26):
# a real run peaked at 12.08 GiB of 40 (39.4 usable) at decoding batch=64 /
# extraction batch=48 -- well under the 75/33 ceilings the earlier
# extrapolated estimate implied, meaning that estimate significantly
# over-stated real cost. Rather than push to the theoretical ceiling this
# now implies (~174 for decoding), the bump is deliberately conservative:
# 1.5x on decoding.batch_size (64->96, OOM-backoff-protected -- see
# sweep.run_with_oom_backoff) and 1.3x on extraction.batch_size (48->62,
# SMALLER factor and NO backoff protecting it -- extraction.py's forward
# pass is the one generation path that has never had backoff, and it's
# what produced the 2.38 GiB allocation behind four straight OOMs earlier
# in this project). A large one-off jump straight to a theoretical ceiling
# is exactly the kind of change that produced surprises before (the
# seq^2-driven memory jump on structured_output_real); a measured,
# moderate step is preferred.
#
# A SPEED CAVEAT THAT MATTERS FOR READING THIS MATRIX: on a 40 GB card a 4B
# model was never memory-constrained (bf16 weights are only ~8 GiB), so
# quantization here buys nothing and costs dequantization on every forward
# pass. At batch 64 the weight read is amortized across the batch, which is
# the regime where nf4's bandwidth saving mostly evaporates while its
# dequant cost does not. Expect bf16 to be the FASTEST per token and
# LLM.int8() the slowest. Preset wall-times therefore measure bitsandbytes
# kernel efficiency at least as much as they measure precision -- the
# QUALITY comparison across presets is the sound one; the speed comparison
# is not a clean quantization result.
#
# Step-count sanity: 2 extracting recipes x 2 extraction methods x 1 layer x
# 13 coefficients x 1 token_scope x 2 n_sweep points (coefficients widened
# 7 -> 13 2026-07-26, mandatory negative analog -- see the coefficients
# comment on harmful_instruction_compliance below for why this specific
# grid). In practice calibrated_abstention_real is skipped on most
# environments (its on_load_error: skip fires on the datasets>=3.7 version
# guard), so the real steering budget is harmful_instruction_compliance
# (~4732 generations per model, up from ~2548 at 7 coefficients) plus the
# XSTest cross-recipe control, which is NOT counted in the progress
# denominator because it has no steer split of its own but still generates
# (~60 examples x 13 coefficients x 4 vectors = ~3120 per model). Batch
# sizes were also raised (see the Memory sizing section above) so
# per-generation cost should fall even as generation COUNT rises.
# structured_output_real was removed -- see the note in the recipes list.
# ============================================================================
experiment:
  name: quantization-4bit-baseline
  seed: 17
  n_sweep: [10, 40]
artifacts:
  root: /content/steering_factory_artifacts
  publish_root: null
models:
  - id: qwen3_4b_4bit
    name_or_path: Qwen/Qwen3-4B
    dtype: bfloat16
    quantization: 4bit
  - id: gemma3_4b_4bit
    name_or_path: google/gemma-3-4b-it
    dtype: bfloat16
    quantization: 4bit
splits:
  seed: 17
  steer_fraction: 0.4
  validation_fraction: 0.2
  group_key: category
capability_probe:
  enabled: true
  max_new_tokens: 24
decoding:
  # CHANGED 2026-07-26: 96 -> 256 -> 384. A real run showed 100% of
  # harmful_instruction_compliance rows (488/488 per coefficient cell)
  # hit the 96-token cap -- not one generation finished naturally. These
  # models open with a long preamble ("I understand you're asking
  # about...", "**Disclaimer:**...") before the actual refusal or
  # compliance, so 96 tokens truncates away the very thing being scored.
  # Qwen3 is worse: 81.7% of its rows were still inside an unclosed
  # <think> block at 96 tokens (fixed by enable_thinking=False in
  # model_utils.format_chat).
  #
  # 256 was a real improvement but still not enough: a follow-up run
  # (with thinking disabled) showed 97-100% of rows STILL hitting the
  # 256 cap, and checking how outputs actually END (not just whether they
  # hit the cap) split the two models -- qwen ends cleanly 46% of the
  # time (complete sentences), gemma only 23% (cut mid-word: "serve no
  # constructive", "binds to the"). Raised to 384 to give gemma the room
  # its longer preambles need; still not unlimited, since a truly
  # degenerate config (see DEFAULT_FLUENCY_CAP_RATIO) should be caught by
  # the fluency gate rather than allowed to run forever.
  max_new_tokens: 384
  # Raised 64 -> 96 (see header). Generation has OOM backoff plus length
  # bucketing, so overshooting here degrades throughput instead of
  # killing the run.
  batch_size: 96
extraction:
  # Raised 48 -> 62, a smaller step than decoding's -- see header. Still
  # deliberately BELOW decoding.batch_size: extraction.py's forward pass
  # has no OOM backoff, and _collect_diffs batches pos+neg together (2*N
  # texts per forward pass).
  batch_size: 62
recipes:
  - id: harmful_instruction_compliance
    behavior: harmful_instruction_compliance
    dataset:
      adapter: harmbench
      dataset: walledai/HarmBench
      subset: standard
      reviewed_dataset_card: true
      # Raised from 100 to 150 uniformly across every extracting recipe --
      # a real run's QLoRA n_validation fell to 17 (below min_split_size:
      # 20) after the quality-key filter dropped None-scored rows, even at
      # a nominal split of 20. 150 gives validation=30 with margin.
      max_records: 250
    # Dropped `pca`: least-motivated of the three methods for a first
    # correctness pass. Coefficients widened from [-1,0,1] to
    # [-2,-1,-0.5,0,0.5,1,2] -- cheap axis (1 layer x 1 scope), and this is
    # the vector-validity/dose-response check.
    extraction: [mean_diff, whitened_mean_diff]
    application:
      layers: ["mid"]
      coefficients: [-2, -1.5, -1, -0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75, 1, 1.5, 2]
      token_scopes: [all]
  - id: calibrated_abstention_real
    behavior: appropriate_abstention
    dataset:
      adapter: abstentionbench
      dataset: facebook/AbstentionBench
      reviewed_dataset_card: true
      on_load_error: skip
      max_records: 250
    extraction: [mean_diff, whitened_mean_diff]
    application:
      # No grid existed here before -- defaulted to coefficient=1.0 only
      # (plus implicit 0.0). Widened to match harmful's grid.
      layers: ["mid"]
      coefficients: [-2, -1.5, -1, -0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75, 1, 1.5, 2]
      token_scopes: [all]
  # REMOVED: structured_output_real (JSONSchemaBench).
  #
  # Cut after it OOMed four separate runs and produced no usable signal.
  # Both reasons are worth keeping written down, because they are selection
  # criteria for any future recipe, not just facts about this one:
  #
  #  1. MEMORY. Its prompts embed a whole JSON schema, so lengths ranged from
  #     a few dozen tokens to the truncation cap. Raising that cap to 2048 so
  #     schemas stopped being cut mid-object made extraction's own forward
  #     pass allocate 64 texts x 2048 x 9728 (the MLP intermediate) = 2.38 GiB
  #     in one tensor -- the exact allocation every OOM reported. No other
  #     recipe here has prompts remotely that long or that variable.
  #  2. NO SIGNAL. Even before the memory problem, JSON parsing succeeded on
  #     2 of 2160 steering rows and 1 of 360 QLoRA rows. Its quality key
  #     (leaf_exact_match) is None whenever parsing fails, and a recipe whose
  #     quality is None everywhere is silently DROPPED from the comparison
  #     rather than reported as a zero -- so it consumed roughly half the
  #     run's generation budget and contributed nothing to the report.
  #
  # Nothing is lost: the jsonschemabench adapter, the structured_output
  # behavior, and structured_score all remain in the codebase. Re-add this
  # block to run it, ideally as its OWN manifest so its memory profile can
  # only take down its own run -- and give extraction its own smaller
  # batch size there, since extraction.py's forward pass has no OOM backoff.
  - id: sycophancy_agreement
    # Anthropic/model-written-evals, sycophancy subset (Perez et al. 2022).
    # Replaces structured_output_real, and was chosen against the criteria
    # that recipe's failure produced:
    #   - forced A/B answer, so max_new_tokens: 8 instead of 96 -- roughly
    #     1/12 the decode work per row, which is why adding a whole recipe
    #     costs only ~8% more token budget.
    #   - mc_correct is 0.0/1.0 and NEVER None, so this recipe cannot be
    #     silently dropped from the comparison the way a never-parsing
    #     structured_output was.
    #   - structurally uniform prompts (biography + question + "Choices:"),
    #     so batch memory is predictable. They are NOT short -- the
    #     biography preamble runs to ~600 tokens -- but they sit inside the
    #     1024 default cap and do not vary by an order of magnitude the way
    #     JSON schemas did.
    #   - it is the canonical CAA behavior (Rimsky et al.), so there is
    #     published evidence the steering signal exists at this scale --
    #     unlike structured output, where we had no prior reason to expect
    #     a 4B model to succeed at all.
    behavior: multiple_choice_eval
    dataset:
      adapter: model_written_evals
      dataset: Anthropic/model-written-evals
      # One adapter serves the whole repo; `subset` is a path inside it, so
      # the 16 advanced-ai-risk/human_generated_evals files and the persona
      # set are each a pure-YAML addition with no new code.
      subset: sycophancy/sycophancy_on_political_typology_quiz.jsonl
      reviewed_dataset_card: true  # cc-by-4.0
      max_records: 250
    extraction: [mean_diff, whitened_mean_diff]
    application:
      layers: ["mid"]
      coefficients: [-2, -1.5, -1, -0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75, 1, 1.5, 2]
      token_scopes: [all]
    decoding:
      # CHANGED 2026-07-26: 8 -> 48, plus system_prompt added. 48 alone
      # (with thinking disabled) fixed Qwen3 -- mc_parsed 0.6% -> 63.4% on
      # a real run -- but Gemma stayed at 37.8% parsed: it has NO thinking
      # mode to disable and spends the entire 48-token budget on
      # conversational preamble ("Okay, Tom Brady, thanks for sharing a
      # bit about yourself..."). Verified: ZERO of its 4,853 unparsed rows
      # contained an (A)/(B) anywhere -- it never reaches an answer, so
      # this was never a format-recognition problem, and more tokens alone
      # would only buy more preamble. The terse system_prompt below
      # addresses that directly; see project memory
      # gemma-needs-answer-first-instruction.md.
      max_new_tokens: 48
      system_prompt: "Answer with only the letter in parentheses (e.g. \"(A)\"). Do not explain or add any other text."
  - id: benign_over_refusal_control
    behavior: harmful_instruction_compliance
    dataset:
      adapter: xstest
      dataset: walledai/XSTest
      reviewed_dataset_card: true
      # Trimmed 100 -> 60: with the harmful grid at 7 coefficients x 4
      # vectors this control was the single biggest generation consumer in
      # the run (~2800/model, more than the recipe it controls for). 60 is
      # still ample for a false-refusal rate.
      max_records: 60
      apply_vectors_from: harmful_instruction_compliance
      # QLoRA counterpart to apply_vectors_from above -- see
      # benchmarks.yaml's full comment. Gives the QLoRA arm a benign-
      # over-refusal check it previously had no way to run at all.
      apply_adapter_from: harmful_instruction_compliance
finetune:
  backend: qlora
  matched_split: steer
  objective: dpo
  # CHANGED 2026-07-26: max_steps: 25 -> epochs: 1. A fixed step count
  # confounds the N-sweep: with batch_size=4 * gradient_accumulation=2 = 8
  # effective, 25 steps is 12.7 epochs at N=10 (memorizes -- loss ~1e-6,
  # rewards/margins 14-19, the collapse signature) but only 5.0 epochs at
  # N=40 (converges normally) -- a real run's train-loss log showed this
  # exact split, misread at first as "unstable alternating loss" before
  # the epoch counts in the log were checked. `epochs: 1` makes every N
  # point see each training example exactly once, so N is the only
  # variable the data-efficiency curve is measuring.
  epochs: 1
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  batch_size: 4
  gradient_accumulation_steps: 2
